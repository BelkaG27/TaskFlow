name : CI

on : 
  push :
    branches : [main]
  pull_request :
    branches : [main]


jobs : 
  build-and-test :
    runs-on : ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: taskflow_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps :
      - name : Recuperation du code
        uses : actions/checkout@v4
      
      - name : Installation de Java
        uses : actions/setup-java@v4
        with : 
          java-version : '21'
          distribution : 'temurin'

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name : Lancer les tests
        run : ./mvnw test

