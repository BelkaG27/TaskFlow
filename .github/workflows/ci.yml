name : CI

on : 
  push :
    branches : [main]
  pull_request :
    branches =: [main]


jobs : 
  build-and-test :
    runs-on : ubuntu-latest

    steps :
      - name : Recuperation du code
        uses : actions/checkout@v4
      
      - name : Installation de Java
        uses : actions/setup-java@v4
        with : 
          java-version : '21'
          distribution : 'temurin'

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw
        
      - name : Lancer les tests
        run : ./mvnw test

